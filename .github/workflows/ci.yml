name: Build and Deploy

on:
  push:
    branches:
      - source
  # Lets you re-index on demand from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  index-search:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deploy-pages returns as soon as the deployment is created; the CDN
      # needs a moment before the crawler sees the new pages.
      - name: Let the deployment propagate
        run: sleep 60

      - name: Run DocSearch scraper
        env:
          APPLICATION_ID: 9JAHOV00P8
          API_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: |
          docker run \
            -e APPLICATION_ID \
            -e API_KEY \
            -e "CONFIG=$(jq -r tostring < docsearch-config.json)" \
            algolia/docsearch-scraper
